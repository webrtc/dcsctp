[package]
name = "dcsctp-fuzz"
version = "0.0.0"
publish = false
edition = { workspace = true }
metadata = { cargo-fuzz = true }

[dependencies]
dcsctp = { workspace = true, features = ["fuzz-internals"] }
libfuzzer-sys = { workspace = true }

[lints]
workspace = true

[[bin]]
name = "parse-parameters"
path = "fuzz_targets/parse_parameters.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse-error-causes"
path = "fuzz_targets/parse_error_causes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse-packet"
path = "fuzz_targets/parse_packet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-outstanding-data"
path = "fuzz_targets/fuzz_outstanding_data.rs"
test = false
doc = false
bench = false
